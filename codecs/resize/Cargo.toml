[package]
name = "squoosh-resize"
version = "0.1.0"
authors = ["Surma <surma@surma.link>"]
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
fast_image_resize = { version = "6.1", default-features = false, features = ["std"] }
wasm-bindgen = "0.2"

[profile.release]
lto = true
# The convolution inner loops are the whole cost of this module, and it's only
# ~30KB of wasm, so speed beats size here (oxipng uses "s" for the opposite
# reason). fast_image_resize's own release profile is also opt-level = 3.
opt-level = 3
